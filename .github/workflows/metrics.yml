name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: asmaaaa01ab
          template: classic
          filename: assets/metrics.svg
          config_timezone: Africa/Casablanca

          # Section minimale (obligatoire), masquée juste après
          base: header
          extras_js: |
            document.querySelector("header")?.remove()

          # Activité sous forme de graphiques (commits par jour et par heure)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_charts: yes

          # Langages les plus utilisés
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8

          config_order: habits, languages